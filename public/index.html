<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta name="description" content="专注盒子：集备忘录、番茄钟与任务清单于一体的自托管效率工具。" />
    <title>专注盒子</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/views.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('focusbox.theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : null;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#15161a' : '#f5f3ee');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="boot-logo">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="26" r="15" fill="#e8553f" />
            <path
              d="M24 12c-1.2-4.2-5.6-6.2-9.4-5.4 1.7 2.7 4.2 4.3 7 4.8-3.6.2-6.7 1.9-8.2 4.1 3.6.4 7-.7 9.6-2.6 2.6 1.9 6 3 9.6 2.6-1.5-2.2-4.6-3.9-8.2-4.1 2.8-.5 5.3-2.1 7-4.8-3.8-.8-8.2 1.2-9.4 5.4Z"
              fill="#2f9e79"
            />
            <path d="M24 19v7l4.5 3" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" />
          </svg>
        </div>
        <p class="boot-title">专注盒子</p>
        <p class="boot-text">正在整理你的备忘录与清单…</p>
        <span class="spinner"></span>
      </div>
    </div>
    <div id="drawer-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
