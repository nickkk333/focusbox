name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z，例如 1.0.0）'
        required: true
        default: '1.0.0'
      publish:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build image tarballs and fnOS fpk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须为 X.Y.Z（当前：$VERSION）" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "focusbox:${VERSION}-amd64" \
            --load \
            .

      - name: Build arm64 image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx build \
            --platform linux/arm64 \
            --tag "focusbox:${VERSION}-arm64" \
            --load \
            .

      - name: Export image tarballs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          docker tag "focusbox:${VERSION}-amd64" "focusbox:${VERSION}"
          docker save -o "release/focusbox-${VERSION}-amd64.tar" "focusbox:${VERSION}"
          docker rmi "focusbox:${VERSION}" >/dev/null
          docker tag "focusbox:${VERSION}-arm64" "focusbox:${VERSION}"
          docker save -o "release/focusbox-${VERSION}-arm64.tar" "focusbox:${VERSION}"
          docker rmi "focusbox:${VERSION}" >/dev/null
          ls -lh release

      - name: Install fnpack
        shell: bash
        env:
          FNPACK_VERSION: 1.2.3
          FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256}  /tmp/fnpack" | sha256sum -c -
          sudo install -m 755 /tmp/fnpack /usr/local/bin/fnpack
          fnpack --help >/dev/null

      - name: Build fnOS fpk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x deploy/fnos/build.sh deploy/fnos/cmd/*
          ./deploy/fnos/build.sh \
            "$VERSION" \
            "release/focusbox-${VERSION}-amd64.tar" \
            "release/focusbox-${VERSION}-arm64.tar" \
            release

      - name: Smoke test image and authentication
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf .smoke-data
          mkdir -p .smoke-data
          chmod 777 .smoke-data
          docker run -d \
            --name focusbox-smoke \
            -p 18083:3000 \
            -e FOCUSBOX_USERNAME=admin \
            -e FOCUSBOX_PASSWORD=secret123 \
            -v "$PWD/.smoke-data:/data" \
            "focusbox:${VERSION}-amd64"
          trap 'docker rm -f focusbox-smoke >/dev/null 2>&1 || true; rm -rf .smoke-data' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18083/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18083/api/health | grep -q '"status":"ok"'

          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/)"
          [ "$CODE" = "401" ] || { echo "未认证访问应返回 401，实际为 $CODE" >&2; exit 1; }

          CODE="$(curl -s -o /dev/null -w '%{http_code}' -u admin:secret123 http://127.0.0.1:18083/)"
          [ "$CODE" = "200" ] || { echo "认证后访问应返回 200，实际为 $CODE" >&2; exit 1; }

          echo "镜像与访问认证冒烟测试通过。"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusbox-${{ steps.version.outputs.version }}
          path: |
            release/focusbox-*.tar
            release/focusbox-*.fpk
            release/focusbox-*.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            release/focusbox-*.tar
            release/focusbox-*.fpk
            release/focusbox-*.sha256
          generate_release_notes: true
