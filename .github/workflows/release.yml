name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z，例如 1.0.4）'
        required: true
        default: '1.0.4'
      publish:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build multi-arch image and fnOS fpk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号必须为 X.Y.Z（当前：$VERSION）" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          TAGS=(--tag "${IMAGE_LC}:${VERSION}")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS+=(--tag "${IMAGE_LC}:latest")
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${TAGS[@]}" \
            --push .
          echo "已推送镜像：${IMAGE_LC}:${VERSION}"

      # GHCR 包默认是私有的；尽力自动改为公开，失败时按 README 手动设置。
      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE="${GITHUB_REPOSITORY#*/}"
          gh api --method PATCH "/user/packages/container/${PACKAGE}" -f visibility=public

      - name: Export amd64 image tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          mkdir -p release
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_LC}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')"
          [ -n "$DIGEST" ] || { echo "未找到 amd64 镜像" >&2; exit 1; }
          # 必须按平台 digest 拉取，否则 docker save 会尝试保存多架构 index 而失败。
          docker pull "${IMAGE_LC}@${DIGEST}"
          docker tag "${IMAGE_LC}@${DIGEST}" "focusbox:${VERSION}"
          docker save -o "release/focusbox-${VERSION}-amd64.tar" "focusbox:${VERSION}"
          ls -lh "release/focusbox-${VERSION}-amd64.tar"

      - name: Smoke test image, permissions and authentication
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          rm -rf .smoke-data
          mkdir -p .smoke-data
          # 故意保持 root/当前用户属主，验证入口脚本能修正 /data 权限。
          docker run -d \
            --name focusbox-smoke \
            -p 18083:3000 \
            -e FOCUSBOX_USERNAME=admin \
            -e FOCUSBOX_PASSWORD=secret123 \
            -v "$PWD/.smoke-data:/data" \
            "focusbox:${VERSION}"
          trap 'docker rm -f focusbox-smoke >/dev/null 2>&1 || true; sudo rm -rf .smoke-data' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18083/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18083/api/health | grep -q '"status":"ok"'
          test -f .smoke-data/focusbox.db

          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/)"
          [ "$CODE" = "401" ] || { echo "未认证访问应返回 401，实际为 $CODE" >&2; exit 1; }

          CODE="$(curl -s -o /dev/null -w '%{http_code}' -u admin:secret123 http://127.0.0.1:18083/)"
          [ "$CODE" = "200" ] || { echo "认证后访问应返回 200，实际为 $CODE" >&2; exit 1; }

          echo "镜像、数据目录权限与访问认证冒烟测试通过。"

      - name: Export arm64 image tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_LC}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="arm64") | .digest')"
          [ -n "$DIGEST" ] || { echo "未找到 arm64 镜像" >&2; exit 1; }
          docker pull "${IMAGE_LC}@${DIGEST}"
          docker tag "${IMAGE_LC}@${DIGEST}" "focusbox:${VERSION}"
          docker save -o "release/focusbox-${VERSION}-arm64.tar" "focusbox:${VERSION}"
          docker rmi "focusbox:${VERSION}" >/dev/null
          ls -lh "release/focusbox-${VERSION}-arm64.tar"

      - name: Install fnpack
        shell: bash
        env:
          FNPACK_VERSION: 1.2.3
          FNPACK_SHA256: 54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256}  /tmp/fnpack" | sha256sum -c -
          sudo install -m 755 /tmp/fnpack /usr/local/bin/fnpack
          fnpack --help >/dev/null

      - name: Build fnOS fpk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x deploy/fnos/build.sh deploy/fnos/cmd/*
          ./deploy/fnos/build.sh "$VERSION" release
          ls -lh release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build Android APK
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x android/build.sh
          ./android/build.sh
          mkdir -p release
          cp "android/dist/focusbox-android-${APP_VERSION}.apk" release/
          sha256sum "release/focusbox-android-${APP_VERSION}.apk" \
            > "release/focusbox-android-${APP_VERSION}.apk.sha256"
          ls -lh release/focusbox-android-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusbox-${{ steps.version.outputs.version }}
          path: |
            release/focusbox-*.tar
            release/focusbox-*.fpk
            release/focusbox-android-*.apk
            release/focusbox-*.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            release/focusbox-*.tar
            release/focusbox-*.fpk
            release/focusbox-android-*.apk
            release/focusbox-*.sha256
          generate_release_notes: true
